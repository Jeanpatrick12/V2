<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Carré arrondi plein, sans marge interne, aux memes proportions que le
       logo affiche dans la nav (fond carre arrondi, meme rouge, meme cle
       blanche) : coherent dans l'onglet du navigateur. Google recadre de
       toute facon le favicon en cercle dans ses resultats de recherche —
       comme le fond va bord a bord jusqu'aux 4 coins, ce recadrage ne
       revele jamais de zone vide, meme sans que le fichier source soit
       lui-meme un cercle. -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#E84533"/>
  <!-- ti-key Tabler Icons outline, 24x24 -->
  <g transform="translate(2.2,2.2) scale(1.15)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
    <path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0z"/>
  </g>
</svg>
