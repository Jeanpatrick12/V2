<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond rond plein (au lieu d'un carré) : Google/les navigateurs recadrent
       déjà le favicon en cercle dans les résultats de recherche, mais un
       fond carré laisse un halo de marge intérieure une fois ce recadrage
       appliqué. En partant d'un cercle plein, l'icône peut occuper tout
       l'espace visuel réellement disponible. -->
  <circle cx="16" cy="16" r="16" fill="#E84533"/>
  <!-- ti-key Tabler Icons outline, 24x24 -->
