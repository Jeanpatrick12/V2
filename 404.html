<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!--sa_annonce_router--><script>(function(){
  var m = location.pathname.match(/^\/annonce\/([a-z0-9-]+?)\/?$/i);
  var id8 = m && (m[1].match(/([0-9a-f]{8})$/i) || [])[1];
  if (!id8) return;
  document.documentElement.style.visibility = "hidden";
  if (window.innerWidth <= 768 && !localStorage.sa_force_desktop && !/[?&]desktop=1/.test(location.search)) {
    document.addEventListener("DOMContentLoaded", function(){
      document.body.innerHTML = "";
      document.body.style.margin = "0";
      document.body.style.overflow = "hidden";
      var f = document.createElement("iframe");
      f.src = "/m/annonce.html?id=" + encodeURIComponent(id8);
      f.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#fff";
      f.onload = function(){ try{document.title=f.contentDocument.title}catch(e){} document.documentElement.style.visibility=""; };
      f.setAttribute("scrolling","yes");
      document.body.appendChild(f);
    });
    return;
  }
  fetch("/annonce.html").then(function(r){ return r.text(); }).then(function(html){
    document.open();
    document.write(html);
    document.close();
  }).catch(function(){
    location.replace("/annonce?id=" + encodeURIComponent(id8));
  });
})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — SansAgents</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;background:#fafafa;min-height:100vh;display:flex;flex-direction:column}

.sa-nav-wrapper{background:white;border-bottom:1px solid #efefef}
.sa-nav{max-width:1240px;margin:0 auto;padding:0 40px;display:flex;align-items:center;height:64px}
.sa-nav-left{display:flex;align-items:center;gap:10px;cursor:pointer}
.sa-logo{background:#E84533;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.sa-logo i{color:white;font-size:18px}
.sa-brand{font-size:19px;font-weight:700;color:#111;letter-spacing:-0.3px}
.sa-brand span{color:#E84533}

.nf-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 20px}
.nf-card{max-width:420px;text-align:center}
.nf-code{font-size:15px;font-weight:800;color:#E84533;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.nf-icon{width:76px;height:76px;border-radius:50%;background:#fff0ee;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:34px;color:#E84533}
.nf-title{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-bottom:10px}
.nf-text{font-size:14.5px;color:#777;line-height:1.6;margin-bottom:28px}
.nf-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nf-btn{border-radius:11px;padding:12px 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.nf-btn-primary{background:#E84533;color:white;border:none}
.nf-btn-primary:hover{background:#c93a2a}
.nf-btn-ghost{background:white;color:#111;border:1.5px solid #e0e0e0}
.nf-btn-ghost:hover{border-color:#ccc}
</style>
</head>
<body>

<div class="sa-nav-wrapper">
  <nav class="sa-nav">
    <a class="sa-nav-left" href="/" style="text-decoration:none">
      <div class="sa-logo"><i class="ti ti-key"></i></div>
      <div class="sa-brand">Sans<span>Agents</span></div>
    </a>
  </nav>
</div>

<div class="nf-wrap">
  <div class="nf-card">
    <div class="nf-code">Erreur 404</div>
    <div class="nf-icon"><i class="ti ti-map-pin-off"></i></div>
    <div class="nf-title">Cette page n'existe pas</div>
    <p class="nf-text">Le lien est peut-être incorrect, ou l'annonce que vous cherchiez a été retirée. Vous pouvez revenir à l'accueil ou consulter les annonces disponibles.</p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="/"><i class="ti ti-home"></i> Retour à l'accueil</a>
      <a class="nf-btn nf-btn-ghost" href="/annonces"><i class="ti ti-building-estate"></i> Voir les annonces</a>
    </div>
  </div>
</div>

</body>
</html>
