name: Mettre à jour le sitemap

on:
  schedule:
    # Tous les jours à 4h du matin (heure serveur UTC = 5h/6h en France selon la saison)
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Commit et push si le sitemap a changé
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap déjà à jour."
            exit 0
          fi
          git config user.name "sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Mise à jour automatique du sitemap"
          git push
